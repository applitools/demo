<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log viewer</title>
    <link rel="stylesheet" type="text/css" href="https://noam-gaash.co.il/bio/main.css" />
</head>
<body>
    <script>var exports = {};</script>
    <script src="https://unpkg.com/@applitools/core@4.16.2/dist/troubleshoot/logs.js"></script>
    
    <div id="logsViewerApp"></div>

    <div class="container">
        <sidebar>
          <h2>Select a File</h2>
          <div
            id="drop-area"
            ondrop="dropHandler(event);"
            ondragover="dragOverHandler(event);"
          >
            <p>
              Drag & drop a file here or <label for="file-input">click here</label> to
              select a file to upload.
            </p>
            <input type="file" id="file-input" onchange="handleFile(this.files)" />
          </div>
        </sidebar>
        <main>
          <h1 id="file-name"></h1>
          <hr />
          <h2><label><input type="checkbox" id="logs">logs</label></h2>
          <pre id="raw-logs"></pre>
          <h2><label><input type="checkbox" id="analyzed">analyzed</label></h2>
          <pre id="analyzed-logs"></pre>
          <h2><label><input type="checkbox" id="structured">structured</h2>
          <pre id="structured-logs"></pre>
        </main>
    </div>

    
<script>

    const errorIndicators = ['Exception:', 'Error at', 'reason: Error: ', 'Error in', `failed due to an error`]

    function dragOverHandler(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
    }

    function dropHandler(event) {
        event.preventDefault();
        const files = event.dataTransfer.files;
        handleFile(files);
    }

    function handleFile(files) {
        const file = files[0];
        const reader = new FileReader();

        reader.onload = function (event) {
            const contents = event.target.result;
            const result = contents

            process({ data: result, filename: file.name });
        }
        reader.readAsText(file);
    }

    function process({data, filename}){
        const logs = exports.parseLogs(data.split('\n').map(s=>s.replace(/^background\.js:\d+ /, '')).join('\n'))
        const structured = exports.analyzeLogs(structureLogs(logs))
        document.getElementById('file-name').innerText = filename;
        
        if (document.getElementById('logs').checked) {
            document.getElementById('raw-logs').innerText = JSON.stringify(logs, null, 2)
        }
        if (document.getElementById('analyzed').checked) {
            const analyzed = exports.analyzeLogs(structureLogs(logs))
            document.getElementById('analyzed-logs').innerHTML = JSON.stringify(analyzed, null, 2)
        }
        if (document.getElementById('structured').checked) {
            document.getElementById('structured-logs').innerHTML = JSON.stringify(structured, null, 2)
        }
        console.log(structured)
        addErrorNotations(structured)
        startApp(structured)
        window.structured = structured
    }

</script>


<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.10.3/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react,stage-3">


  ///////////////////////////        start log drilldown view       //////////////////////////////////////////

  const LogLinesViewer = ({logs}) => {
    const [isOpen, setIsOpen] = React.useState(false)

    const renderLine = (line, index) => {
        return (
            <div className={"log-line"}>
                {line}
            </div>
        )
    }

    const renderLog = (log, index) => {
        return (
            <div key={index} className={"log"}>
                {log}
            </div>
        )
    }

    return isOpen ? (
        <>
            {logs ? <pre className="logs">
                {logs.map(renderLog)}
            </pre> : "no logs"}
            <button  onClick={()=>setIsOpen(false)} title="click to collapse">
                Close logs
            </button>
        </>
    ) : logs ? <button onClick={() => setIsOpen(true)}>
        see logs
    </button> : null
  }

  const LogsContainer = ({data, name, level=0}) => {
    if(!data) return null
    const [isOpen, setIsOpen] = React.useState(level < 2)
    const kids = Object.entries(data).map(([name, data]) => ({name, data})).filter(({data}) => data && data.startedAt)

    return (
      <div className={`logs-container${data.hasError?' error':''}`}>
        <ul onClick={()=>setIsOpen(!isOpen)}>
            <h3>{name ?? "Global log level"}</h3>
            <li className="time">time: {data.time / 1000} seconds</li>
            <li>kids: {kids.length}</li>
        </ul>
        {kids.length ? isOpen ? <button onClick={()=>setIsOpen(false)}>Close</button> : <button onClick={()=>setIsOpen(true)}>Open</button> : null}
        <LogLinesViewer logs={data.logs} />
        <div className="kids">
            {isOpen && kids.map((kid, index) =>
                <LogsContainer data={kid.data} name={kid.name} level={level+1} key={index}/>
            )}
        </div>
      </div>
    );
  };

  function addErrorNotations(obj) {
    for (let key in obj) {
        if (obj.hasOwnProperty(key)) {
            if (typeof obj[key] === 'object' && obj[key] !== null) {
                if(addErrorNotations(obj[key])) {
                    obj[key].hasError = true
                    obj.hasError = true
                }
            } else if (typeof obj[key] === 'string' && errorIndicators.some(indicator => obj[key].includes(indicator))) {
                obj[key].hasError = true
                obj.hasError = true
            }
        }
    }
    return obj.hasError
  }

  ///////////////////////////        end log drilldown view       //////////////////////////////////////////

  ///////////////////////////        start render targets analyzer       //////////////////////////////////////////

  const RenderTargetsAnalizer = ({data}) => {
    const targets = searchObjects(data, "render-target")
    return <>
        <h1>Render Targets</h1>
        <div className="render-targets">
            {
            targets.map(target => <div className={`render-target ${target.hasError ? "error" : ""}`}>
                <h3>{target[0]}</h3>
                <UploadResourceAnalizer data={target[1]}/>
            </div>)
        }
        </div>
    </>;
  }

  const UploadResourceAnalizer = ({data}) => {
    const resources = searchObjects(data, "upload-resource")
    const [isOpen, setIsOpen] = React.useState(false);
    
    return (
        <>
            <button onClick={() => setIsOpen(!isOpen)}>
                {isOpen ? "Collapse" : "Expand"}
            </button>
            {isOpen && (
                <>
                    Total resources: {resources.length}
                    <div className="upload-resources">
                        {resources.map(uploadResource => (
                            <div
                                className={`upload-resource ${
                                    uploadResource.hasError ? "error" : ""
                                }`}
                            >
                                <h4>{uploadResource[0]}</h4>
                            </div>
                        ))}
                    </div>
                </>
            )}
        </>
    );
}

  function searchObjects(data, needle="render-target") {
    if(typeof data === "object") {
        const entries = Object.entries(data)
        if(entries.length)
            return entries.filter(([name]) => name.includes(needle)).concat(entries.flatMap(([_, log]) => searchObjects(log, needle)))
    }
    return []
  }
  ///////////////////////////        end resources analyzer       //////////////////////////////////////////
  ///////////////////////////        start test list             //////////////////////////////////////////

    const TestList = ({data}) => {
        const classicTests = searchObjects(data, "eyes-classic")
        const ufgTests = searchObjects(data, "eyes-ufg")
        return <div className="test-list classic">
            <h1>Test List</h1>
            <h2> Eyes Classic Tests </h2>
            <div className="test-container">
                {
                    classicTests.map(test => <div className={`test ${test.hasError ? "error" : ""}`}>
                        <h3>{test[0]}</h3>
                        <TestInsights data={test[1]}/>
                    </div>)
                }
            </div>
            {classicTests.length ? null : <div>
                <h3>No Classic tests found</h3>
            </div>}
            <h2> Eyes UFG Tests </h2>
            <div className="test-container">
                {
                    ufgTests.map(test => <div className={`test ${test.hasError ? "error" : ""}`}>
                        <h3>{test[0]}</h3>
                        <TestInsights data={test[1]}/>
                    </div>)
                }
            </div>
            {ufgTests.length ? null : <div>
                <h3>No UFG tests found</h3>
            </div>}
        </div>;
    }

    function TestInsights({data}) {
        const hasGetAccount = searchObjects(data, "get-account")
        const time = data.time / 1000
        const hasOpenEyesLog = data.logs?.filter(log => log.includes("openEyes")).length
        const hasCheck = searchObjects(data, "check-base")
        const hasClose = searchObjects(data, "close-base")
        const hasGetEyesResults = searchObjects(data, "get-eyes-results")
        
        return <div className="test-insights">
            <ul>
                <li>Time: {time} seconds</li>
                <li>Has Get Account: {hasGetAccount.length} {hasGetAccount.hasError ? <div className="error">Error in Get Account</div> : null}</li>
                <li>Has Open Eyes Log: {hasOpenEyesLog}</li>
                <li>Has Check: {hasCheck.length} {hasCheck.hasError ? <div className="error">Error in Check</div> : null}</li>
                <li>Has Close: {hasClose.length} {hasClose.hasError ? <div className="error">Error in Close</div> : null}</li>
                <li>Has Get Eyes Results: {hasGetEyesResults.length} {hasGetEyesResults.hasError ? <div className="error">Error in Get Eyes Results</div> : null}</li>
            </ul>
        </div>;
    }

    ///////////////////////////        end test list             //////////////////////////////////////////

    ///////////////////////////     start errors list            //////////////////////////////////////////


    function getErrorsList (obj) {
        const errors = []
        for (let key in obj) {
            if (obj.hasOwnProperty(key)) {
                if (typeof obj[key] === 'object' && obj[key] !== null) {
                    errors.push(...getErrorsList(obj[key]))
                } else if (typeof obj[key] === 'string' && errorIndicators.some(indicator => obj[key].includes(indicator))) {
                    errors.push(obj[key])
                }
            }
        }
        return errors
    }

    function ErrorsList({data}) {
        const errors = getErrorsList(data)
        return <div className="errors-list">
            <h1>Errors List</h1>
            <ul>
                {errors.map((error, index) => <li key={index} className="error">{error}</li>)}
            </ul>
        </div>
    }

    ///////////////////////////     end errors list            //////////////////////////////////////////


  const root = ReactDOM.createRoot(document.getElementById("logsViewerApp"))
  function startApp(data) {
    root.render(<>
        <LogsContainer data={data}/>
        <TestList data={data}/>
        <RenderTargetsAnalizer data={data}/>
        <ErrorsList data={data}/>
    </>);
  }


</script>

<style>
.logs-container {
    border: 1px solid lightgray;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;

    .kids {
        display: flex;
    }
}
.error {
    border: 2px solid red;
}
.render-targets {
    display: grid;
    grid-template-columns: auto auto auto auto;
    .render-target {
        border: 1px solid lightgray;
    }
}
.test-container {
    display: grid;
    grid-template-columns: auto auto auto auto;
    .test {
        border: 1px solid lightgray;
    }
}
</style>

</body>
</html>
