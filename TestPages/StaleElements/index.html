<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayoutBreakpints</title>
    <script>
        setInterval(() => {
            document.body.innerHTML = "";
            const div = document.createElement("div");
            div.innerHTML = `change is the only constant in life`;
            document.body.appendChild(div);
        }, 1)
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
    
    <!-- GPT made some cool stuff, why not -->
    <style>
        body {
            font-family: 'Cedarville Cursive', cursive;
            background-color: #0a001f;
            color: #fff;
            text-align: center;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at bottom, #1b0031, #000000) no-repeat;
            background-attachment: fixed;
        }
        
        /* Starry background animation */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            animation: twinkling 3s infinite ease-in-out;
            z-index: 1;
        }
        
        @keyframes twinkling {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        div {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #6a0dad, 0 0 20px #aa00ff, 0 0 30px #ff00ff, 0 0 40px #ff00ff;
            position: relative;
            z-index: 2;
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            0% {
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #aa00ff, 0 0 30px #ff00ff, 0 0 40px #6a0dad;
            }
            100% {
                text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff, 0 0 40px #aa00ff, 0 0 50px #ff00ff;
            }
        }
        
        /* Adding floating sparkles effect */
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 5px white;
            animation: sparkle 4s linear infinite;
        }
        
        @keyframes sparkle {
            0% { transform: translateY(0) translateX(0) scale(1); }
            50% { transform: translateY(-50px) translateX(50px) scale(1.2); }
            100% { transform: translateY(0) translateX(0) scale(1); }
        }
        
        /* Multiple sparkles for a magical effect */
        .sparkle:nth-child(2) { left: 20%; animation-duration: 3.5s; }
        .sparkle:nth-child(3) { left: 40%; animation-duration: 4.5s; }
        .sparkle:nth-child(4) { left: 60%; animation-duration: 3s; }
        .sparkle:nth-child(5) { left: 80%; animation-duration: 5s; }
    </style>
</head>
<body>
    <div>
        Change is the only constant in life
    </div>
</style>
</body>
</html>
