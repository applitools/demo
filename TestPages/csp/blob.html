<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline';
        img-src 'self' https://*.picsum.photos https://picsum.photos blob:;
        connect-src 'self' https://*.picsum.photos https://picsum.photos;
    ">
    <title>Document</title>
</head>
<body>
    <img src="https://picsum.photos/150/150" alt="picsum"/>
    <div id="mydiv" style="border: 3px dotted yellow; border-radius: 100%; margin: 3em; display: inline-block; padding: 3em;">
        I AM A DIV
    </div>
    <script>
        fetch('https://picsum.photos/150/150')
            .then(response => response.blob())
            .then(blob => {
                const blobURL = URL.createObjectURL(blob);
                const img = document.createElement('img');
                img.src = blobURL;
                img.alt = 'Blob Image';
                document.body.appendChild(img);
            });
        fetch('https://picsum.photos/100/100')
            .then(response => response.blob())
            .then(blob => {
                const blobURL = URL.createObjectURL(blob);
                document.getElementById("mydiv").style.backgroundImage = `url(${blobURL})`
            });
    </script>
</body>
</html>
