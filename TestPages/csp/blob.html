<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline';
        img-src 'self' https://*.picsum.photos https://picsum.photos blob:;
        connect-src 'self' https://*.picsum.photos https://picsum.photos;
    ">
    <title>Document</title>
</head>
<body>
    <img src="https://fastly.picsum.photos/id/867/150/150.jpg?hmac=pI_d1IClDDjpw1LjJLQOIjLSTE13EQQuWB20CXJBY20" alt="picsum"/>
    <div id="mydiv" style="border: 3px dotted yellow; border-radius: 100%; margin: 3em; display: inline-block; padding: 3em;">
        I AM A DIV
    </div>
    <script>
        fetch('https://fastly.picsum.photos/id/530/150/150.jpg?hmac=N39NeLHvmgIPFGNp6EwQtbJj8sfixdzIktgXqCF4S5g')
            .then(response => response.blob())
            .then(blob => {
                const blobURL = URL.createObjectURL(blob);
                const img = document.createElement('img');
                img.src = blobURL;
                img.alt = 'Blob Image';
                document.body.appendChild(img);
            });
        fetch('https://fastly.picsum.photos/id/136/100/100.jpg?hmac=oWzL5pfcxuyOxGb_TO11qZNTGx28Va1pL3Rtq0UCnFo')
            .then(response => response.blob())
            .then(blob => {
                const blobURL = URL.createObjectURL(blob);
                document.getElementById("mydiv").style.backgroundImage = `url(${blobURL})`
            });
    </script>
</body>
</html>
