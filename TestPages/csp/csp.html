<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>csp</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'sha256-cNcIVuV7fgaNpGxT+vCDWaPiX3uDx9yGhz8yxTjdhig=';">
  </head>
  <body>
    <script>
      /*
        Some pages monkey-patch native JS globals (analytics, polyfills, security tools).
        When there's a Content-Security-Policy header/meta, the dom-snapshot iframe sandbox
        cannot inject its <script> tag and falls back to running in the main context where
        the monkey-patching breaks it.

        With APPLITOOLS_BYPASS_CSP=true, the SDK sends Page.setBypassCSP before taking the
        snapshot, allowing the iframe sandbox to work and isolating dom-snapshot from the patches.
      */

      JSON.stringify = () => { throw new Error('stringify is not allowed'); };
      for (const func of ['push', 'pop', 'shift', 'unshift', 'splice', 'concat', 'join', 'slice', 'map', 'forEach', 'reduce', 'filter', 'some', 'every']) {
        Array.prototype[func] = () => { throw new Error(`${func} is not allowed`); };
      }
      for (const func of ['assign', 'keys', 'values', 'entries', 'fromEntries']) {
        Object[func] = () => { throw new Error(`${func} is not allowed`); };
      }
      for (const func of ['addEventListener', 'removeEventListener', 'dispatchEvent']) {
        EventTarget.prototype[func] = () => { throw new Error(`${func} is not allowed`); };
      }
      for (const func of ['fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource']) {
        window[func] = () => { throw new Error(`${func} is not allowed`); };
      }
    </script>
  </body>
</html>
