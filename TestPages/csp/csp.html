<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>csp</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'sha256-Zmjo2dZV59Q7bspK/FYBw4Wm9nZEn/va97jx++IzqwI=';">
  </head>
  <body>
    <script>
      /*
        Some pages monkey-patch native JS globals (analytics, polyfills, security tools).
        When there's a Content-Security-Policy header/meta, the dom-snapshot iframe sandbox
        cannot inject its <script> tag and falls back to running in the main context where
        the monkey-patching breaks it.

        With APPLITOOLS_BYPASS_CSP=true, the SDK sends Page.setBypassCSP before taking the
        snapshot, allowing the iframe sandbox to work and isolating dom-snapshot from the patches.
      */

      // JSON.stringify acts as a tripwire: if dom-snapshot's iframe sandbox fails (because
      // CSP blocks script injection and no bypass is active), it falls back to the main
      // context where this patch would throw and the snapshot would fail.
      // With APPLITOOLS_BYPASS_CSP=true, the sandbox script injects successfully and
      // dom-snapshot runs inside the iframe's isolated JS context where JSON is clean.
      //
      // Note: Array.prototype.* is intentionally NOT patched here. Dom-snapshot's sandbox
      // wrapper code (which runs in the main context) uses Array methods to manage the
      // iframe lifecycle, so patching them would break the snapshot even with CSP bypass.
      JSON.stringify = () => { throw new Error('stringify is not allowed'); };
    </script>
  </body>
</html>
