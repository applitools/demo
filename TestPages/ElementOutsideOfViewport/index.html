<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Element Outside of Viewport Demo</title>
  <style>
    #outsideButton {
      position: absolute;
      top: -100px; /* Outside the visible viewport */
      left: -200px; /* Outside the visible viewport */
    }
  </style>
</head>
<body>
  <p id="loremParagraph">
    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
  </p>
  <button id="outsideButton">Outside Button</button>
</body>
</html>
