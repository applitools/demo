<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Page Test</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .video-container {
            max-width: 800px;
            width: 100%;
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Sample Video Page</h1>

    <div class="video-container">
        <!-- Using "Sintel" - Open Movie by Blender Foundation -->
        <video 
            crossorigin="anonymous" 
            class="cmp-video__video-player" 
            data-video-hook-player="" 
            tabindex="-1" 
            data-is-avs="true" 
            loop 
            autoplay 
            preload="metadata" 
            playsinline 
            muted 
            aria-label="Sintel - Third Open Movie by Blender Foundation" 
            aria-description="The film follows a girl named Sintel who is searching for a baby dragon she calls Scales." 
            data-video-name="poster_video_test" 
            data-video-srclang="en"
            controls 
            id="video-player"
            poster="https://test-streams.mux.dev/x36xhzz/poster.jpg">
            <!-- This source matches what HLS.js is actually playing -->
            <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="application/x-mpegURL">
            <!-- Fallback for browsers without HLS support (standard MP4) -->
            <source src="https://test-streams.mux.dev/x36xhzz/url_0/193039199_mp4_h264_aac_ld_7.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p>Big Buck Bunny - Test Stream</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script>
        const video = document.getElementById('video-player');
        
        // Use a public test HLS stream URL (CORS enabled)
        // This makes it work exactly like the screenshot: using a library to play a .m3u8 file
        const videoSrc = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

        if (Hls.isSupported()) {
            console.log("HLS is supported. Initializing Hls.js...");
            const hls = new Hls();
            
            // This does the magic: fetches the stream and attaches it to the video element
            // This usually results in a src="blob:..." on the video element in the DOM
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log("Manifest parsed, starting playback");
                video.play().catch(e => console.warn("Autoplay blocked, user interaction needed directly."));
            });
        }
        // Fallback for Safari which supports HLS natively
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            console.log("Native HLS support (Safari) detected.");
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
