<!DOCTYPE html>
<html>
  <head>
    <title>Video HLS Fix — All Scenarios</title>
    <style>
      body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
      h1 { font-size: 18px; margin-bottom: 20px; }
      section { margin-bottom: 24px; padding: 16px; background: #fff; border-radius: 8px; }
      .label { font-size: 12px; color: #888; margin: 0 0 8px; }
      video { background: #000; display: block; width: 480px; height: 270px; }
    </style>
  </head>
  <body>
    <h1>Video HLS Fix — All Scenarios</h1>

    <!-- 1. blob src + SOURCE child (HLS) -->
    <section id="s1">
      <p class="label">1. blob src + SOURCE child (HLS)</p>
      <video id="v1" autoplay muted controls playsinline>
        <!-- source.src is set to the inlined m3u8 data URI by the script below -->
        <source id="src1" type="application/x-mpegURL" />
      </video>
    </section>

    <!-- 2. blob src, no SOURCE child -->
    <section id="s2">
      <p class="label">2. blob src, no SOURCE child</p>
      <video id="v2" autoplay muted controls playsinline></video>
    </section>

    <!-- 3. empty video (no src, no source) -->
    <section id="s3">
      <p class="label">3. Empty video (no src, no source)</p>
      <video id="v3" autoplay muted controls playsinline></video>
    </section>

    <!-- 4. regular HTTP src, no SOURCE child -->
    <section id="s4">
      <p class="label">4. Regular HTTP src, no SOURCE child</p>
      <video
        id="v4"
        autoplay
        muted
        controls
        playsinline
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      ></video>
    </section>

    <!-- 5. no src, with SOURCE child -->
    <section id="s5">
      <p class="label">5. No src, with SOURCE child</p>
      <video id="v5" autoplay muted controls playsinline>
        <source
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
          type="video/mp4"
        />
      </video>
    </section>

    <!-- 6. regular src + SOURCE child -->
    <section id="s6">
      <p class="label">6. Regular src + SOURCE child</p>
      <video
        id="v6"
        autoplay
        muted
        controls
        playsinline
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      >
        <source
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
          type="video/mp4"
        />
      </video>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script>
      // HLS playlist with absolute Apple CDN segment URLs.
      // Inlined so this page is fully self-contained — no local server required.
      var M3U8 = [
        '#EXTM3U',
        '#EXT-X-TARGETDURATION:10',
        '#EXT-X-VERSION:3',
        '#EXT-X-MEDIA-SEQUENCE:0',
        '#EXT-X-PLAYLIST-TYPE:VOD',
        '#EXTINF:9.97667,',
        'https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/gear1/fileSequence0.ts',
        '#EXTINF:9.97667,',
        'https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/gear1/fileSequence1.ts',
        '#EXT-X-ENDLIST',
      ].join('\n')

      // data: URI so hls.js can fetch the manifest without needing a server.
      // Absolute segment URLs inside mean no relative-path resolution issues.
      // var M3U8_URL = 'data:application/x-mpegURL;charset=utf-8,' + encodeURIComponent(M3U8)

      // If serving via a web server, you can point directly to the file:
      var M3U8_URL = 'manifest.m3u8';

      function setupHls(video) {
        if (typeof Hls === 'undefined' || !Hls.isSupported()) return
        var hls = new Hls()
        hls.loadSource(M3U8_URL)
        hls.attachMedia(video)
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(function () {})
        })
      }

      // Scenario 1: source.src gets the data URI so the SOURCE child holds the "real" URL
      // while hls.js still sets video.src = blob:... via MSE (the BMW pattern).
      ;(function () {
        document.getElementById('src1').src = M3U8_URL
        setupHls(document.getElementById('v1'))
      })()

      // Scenario 2: hls.js loads directly — no <source> child exists in the DOM.
      setupHls(document.getElementById('v2'))
    </script>
  </body>
</html>
