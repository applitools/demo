<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slow Loading Page for Testing</title>
</head>
<body>
    <h1>Welcome to the Slow Loading Page for Testing</h1>
    <button>test button</button>
    
    <img src="https://httpbin.org/delay/30" alt="" onerror="console.log('image onerror')">
    <p id="counter">0</p>
    <script>
      window.interval = setInterval(() => {
        const curr = Number(counter.textContent)
        counter.textContent = curr + 1
      }, 1000)
      
      window.addEventListener('load', () => {
        document.body.appendChild(document.createTextNode('page is now loaded'))
        // counter.textContent = 'done'
        clearInterval(interval)
      })
    </script>
</body>
</html>
