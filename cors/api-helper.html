<script>
  window.addEventListener('message', async event => {
    // Basic security: In a real app, you might want a stronger origin check
    // if (event.origin !== 'https://www.figma.com') return; 

    const { type, payload } = event.data;
    if (type !== 'XHR_REQUEST') return;

    const { requestId, details, body } = payload;
    
    try {
      const response = await fetch(details.url, {
        method: details.method,
        body: body, // fetch handles null body correctly
        headers: { 'Content-Type': 'application/json' } // Add other headers if needed
      });

      const data = await response.json();

      // Send a SUCCESS response back to the plugin
      parent.postMessage({
        type: 'XHR_RESPONSE',
        payload: {
          requestId,
          ok: response.ok,
          status: response.status,
          statusText: response.statusText,
          data: data
        }
      }, event.origin); // Respond to the origin that sent the request

    } catch (error) {
      // Send an ERROR response back
      parent.postMessage({
        type: 'XHR_RESPONSE',
        payload: {
          requestId,
          ok: false,
          status: 0,
          statusText: error.message,
          data: null
        }
      }, event.origin);
    }
  });
</script>
