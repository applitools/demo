<script>
  window.addEventListener('message', async event => {
    const { type, payload } = event.data;
    if (type !== 'UNIVERSAL_REQUEST') return;

    const { requestId, url, options } = payload;

    try {
      const response = await fetch(url, options);
      
      // Handle different response types. For this SDK, text/json is most common.
      const responseBody = await response.text();

      // Send a SUCCESS response back to the plugin
      parent.postMessage({
        type: 'UNIVERSAL_RESPONSE',
        payload: {
          requestId,
          ok: true,
          response: {
            status: response.status,
            statusText: response.statusText,
            body: responseBody,
            headers: Object.fromEntries(response.headers.entries()),
          },
        }
      }, event.origin);

    } catch (error) {
      // Send an ERROR response back
      parent.postMessage({
        type: 'UNIVERSAL_RESPONSE',
        payload: {
          requestId,
          ok: false,
          error: error.message || 'An unknown network error occurred.',
        }
      }, event.origin);
    }
  });
</script>
