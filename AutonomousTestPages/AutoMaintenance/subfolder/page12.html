<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page</title>
</head>

<body style="text-align: center">
  <div>
    <h1>Page 12 sub folder</h1>
  </div>
  <h3 id="timer"></h3>
  <img src="https://cdn.iconscout.com/icon/free/png-512/free-export-3114432-2598210.png?f=avif&w=256" id="image" />
  <script>
    window.onload = () => {
      const date = new Date();
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const hours = date.getHours();
      const years = date.getFullYear();
      const imageLeftMargin = date.getMinutes()%2 === 0 ? 0 : 50;
      let minutes = 2 * Math.round(date.getMinutes() / 2);
      minutes = minutes === 60 ? 0 : minutes;
      minutes = minutes < 10 ? "0" + minutes : minutes;
      document.getElementById("timer").innerHTML = `${hours}:${minutes}<br/>${day}/${month}/${years}`
      document.getElementById("image").style.marginLeft = `${imageLeftMargin}px`
    };
  </script>
</body>

</html>
